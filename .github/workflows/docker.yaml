name: Mirror Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - images.txt
      - .github/workflows/mirror-images.yml

permissions:
  contents: read

concurrency:
  group: mirror-docker-images
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  mirror:
    name: Mirror Multi-Architecture Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ALIYUN_REGISTRY \
            ALIYUN_NAME_SPACE \
            ALIYUN_REGISTRY_USER \
            ALIYUN_REGISTRY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Login to Aliyun Registry
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ALIYUN_REGISTRY_PASSWORD" |
            skopeo login "$ALIYUN_REGISTRY" \
              --username "$ALIYUN_REGISTRY_USER" \
              --password-stdin

      - name: Mirror all architectures
        shell: bash
        run: |
          set -euo pipefail

          while read -r source target extra; do
            [[ -z "${source:-}" || "$source" == \#* ]] && continue

            if [[ -z "${target:-}" ]]; then
              echo "Invalid images.txt line. Expected: <source-image> <target-image>"
              echo "Actual source: ${source}"
              exit 1
            fi

            if [[ -n "${extra:-}" ]]; then
              echo "Invalid images.txt line. Only two columns are allowed: ${source} ${target} ${extra}"
              exit 1
            fi

            destination="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${target}"

            echo "::group::Mirror ${source} -> ${destination}"

            # --all 保留源镜像的 OCI manifest list，包括 amd64、arm64 等全部架构。
            skopeo copy \
              --all \
              --retry-times 3 \
              "docker://${source}" \
              "docker://${destination}"

            echo "Destination platforms:"
            skopeo inspect --raw "docker://${destination}" |
              jq -r '.manifests[]?.platform | "\(.os)/\(.architecture)"' |
              sort -u || true

            echo "::endgroup::"
          done < images.txt
