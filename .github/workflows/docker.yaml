name: Mirror Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - images.txt
      - .github/workflows/mirror-images.yml

permissions:
  contents: read

concurrency:
  group: mirror-docker-images
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  mirror:
    name: Mirror amd64 and arm64 images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ALIYUN_REGISTRY \
            ALIYUN_NAME_SPACE \
            ALIYUN_REGISTRY_USER \
            ALIYUN_REGISTRY_PASSWORD; do
            [[ -n "${!name:-}" ]] || {
              echo "Missing required secret: ${name}"
              exit 1
            }
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USER }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}

      - name: Mirror amd64 and arm64
        shell: bash
        run: |
          set -euo pipefail

          mirror_context="${RUNNER_TEMP}/image-mirror"
          mkdir -p "${mirror_context}"

          cat > "${mirror_context}/Dockerfile" <<'EOF'
          ARG SOURCE_IMAGE
          FROM ${SOURCE_IMAGE}
          EOF

          declare -A source_by_target

          derive_target() {
            local source="$1"

            if [[ "$source" == *@* ]]; then
              echo "Digest image is not supported without an explicit target tag: ${source}" >&2
              return 1
            fi

            # nginx/nginx-ingress:5.5.4 -> nginx-ingress:5.5.4
            # foo/nginx:1.0 -> nginx:1.0
            # bar/nginx:1.0 -> nginx:1.0
            printf '%s' "${source##*/}"
          }

          ensure_tag() {
            local image="$1"
            local last_part="${image##*/}"

            if [[ "$last_part" == *:* ]]; then
              printf '%s' "$image"
            else
              printf '%s:latest' "$image"
            fi
          }

          while read -r source extra; do
            [[ -z "${source:-}" || "$source" == \#* ]] && continue

            if [[ -n "${extra:-}" ]]; then
              echo "Invalid images.txt line. Only one source image is allowed: ${source} ${extra}"
              exit 1
            fi

            target="$(ensure_tag "$(derive_target "$source")")"
            destination="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${target}"

            if [[ -n "${source_by_target[$target]:-}" ]]; then
              echo "::warning::${source} will overwrite ${source_by_target[$target]} at ${target}"
            fi
            source_by_target[$target]="$source"

            echo "::group::Mirror ${source} -> ${destination}"

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg SOURCE_IMAGE="${source}" \
              --tag "${destination}" \
              --pull \
              --provenance=false \
              --sbom=false \
              --push \
              "${mirror_context}"

            echo "Destination platforms:"
            docker buildx imagetools inspect "${destination}"

            echo "::endgroup::"
          done < images.txt
