name: Mirror Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - images.txt
      - .github/workflows/mirror-images.yml

permissions:
  contents: read

concurrency:
  group: mirror-docker-images
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  mirror:
    name: Mirror all architectures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ALIYUN_REGISTRY \
            ALIYUN_NAME_SPACE \
            ALIYUN_REGISTRY_USER \
            ALIYUN_REGISTRY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Login to Aliyun Registry
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ALIYUN_REGISTRY_PASSWORD" |
            skopeo login "$ALIYUN_REGISTRY" \
              --username "$ALIYUN_REGISTRY_USER" \
              --password-stdin

      - name: Mirror all architectures
        shell: bash
        run: |
          set -euo pipefail

          derive_target() {
            local source="$1"

            # 带 digest 的源镜像必须显式给出第二列目标 tag。
            if [[ "$source" == *@* ]]; then
              echo "Digest image requires an explicit target tag: ${source}" >&2
              return 1
            fi

            source="${source#docker.io/}"
            source="${source#registry-1.docker.io/}"

            # nginx/nginx-ingress:5.5.4 -> nginx_nginx-ingress:5.5.4
            printf '%s' "${source//\//_}"
          }

          while read -r source target extra; do
            [[ -z "${source:-}" || "$source" == \#* ]] && continue

            if [[ -n "${extra:-}" ]]; then
              echo "Invalid images.txt line. Expected one or two columns:"
              echo "<source-image> [target-image]"
              echo "Actual: ${source} ${target} ${extra}"
              exit 1
            fi

            # 第二列可选；未提供时，自动基于源镜像生成目标名。
            if [[ -z "${target:-}" ]]; then
              target="$(derive_target "$source")"
            fi

            destination="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${target}"

            echo "::group::Mirror ${source} -> ${destination}"

            # --all 会同步源镜像的 manifest list，包括 amd64、arm64 等全部架构。
            skopeo copy \
              --all \
              --retry-times 3 \
              "docker://${source}" \
              "docker://${destination}"

            echo "Destination platforms:"
            skopeo inspect --raw "docker://${destination}" |
              jq -r '
                if has("manifests") then
                  .manifests[].platform | "\(.os)/\(.architecture)"
                else
                  "single-platform manifest"
                end
              ' |
              sort -u

            echo "::endgroup::"
          done < images.txt
