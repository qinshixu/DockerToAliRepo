name: Mirror Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - images.txt
      - .github/workflows/mirror-images.yml

permissions:
  contents: read

concurrency:
  group: mirror-docker-images
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  mirror:
    name: Mirror amd64 and arm64 images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ALIYUN_REGISTRY \
            ALIYUN_NAME_SPACE \
            ALIYUN_REGISTRY_USER \
            ALIYUN_REGISTRY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Registry for Buildx
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USER }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}

      - name: Login to Aliyun Registry for Skopeo
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ALIYUN_REGISTRY_PASSWORD" |
            skopeo login "$ALIYUN_REGISTRY" \
              --username "$ALIYUN_REGISTRY_USER" \
              --password-stdin

      - name: Mirror amd64 and arm64
        shell: bash
        run: |
          set -euo pipefail

          derive_target() {
            local source="$1"

            if [[ "$source" == *@* ]]; then
              echo "Digest source requires an explicit target tag: ${source}" >&2
              return 1
            fi

            source="${source#docker.io/}"
            source="${source#registry-1.docker.io/}"

            # nginx/nginx-ingress:5.5.4 -> nginx_nginx-ingress:5.5.4
            printf '%s' "${source//\//_}"
          }

          ensure_tag() {
            local image="$1"
            local last_part="${image##*/}"

            if [[ "$last_part" == *:* ]]; then
              printf '%s' "$image"
            else
              printf '%s:latest' "$image"
            fi
          }

          arch_tag() {
            local image="$1"
            local arch="$2"

            printf '%s-%s' "$image" "$arch"
          }

          while read -r source target extra; do
            [[ -z "${source:-}" || "$source" == \#* ]] && continue

            if [[ -n "${extra:-}" ]]; then
              echo "Invalid images.txt line. Expected: <source-image> [target-image]"
              echo "Actual: ${source} ${target} ${extra}"
              exit 1
            fi

            if [[ -z "${target:-}" ]]; then
              target="$(derive_target "$source")"
            fi

            target="$(ensure_tag "$target")"

            destination="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${target}"
            destination_amd64="$(arch_tag "$destination" "amd64")"
            destination_arm64="$(arch_tag "$destination" "arm64")"

            echo "::group::Mirror ${source} -> ${destination}"

            echo "Copy linux/amd64"
            skopeo copy \
              --override-os linux \
              --override-arch amd64 \
              --retry-times 3 \
              "docker://${source}" \
              "docker://${destination_amd64}"

            echo "Copy linux/arm64"
            skopeo copy \
              --override-os linux \
              --override-arch arm64 \
              --retry-times 3 \
              "docker://${source}" \
              "docker://${destination_arm64}"

            echo "Create multi-architecture manifest"
            docker buildx imagetools create \
              --prefer-index=true \
              --tag "${destination}" \
              "${destination_amd64}" \
              "${destination_arm64}"

            echo "Verify destination platforms"
            platforms="$(
              skopeo inspect --raw "docker://${destination}" |
                jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' |
                sort -u
            )"

            echo "${platforms}"

            if [[ "${platforms}" != $'linux/amd64\nlinux/arm64' ]]; then
              echo "Unexpected destination platforms:"
              echo "${platforms}"
              exit 1
            fi

            echo "::endgroup::"
          done < images.txt
